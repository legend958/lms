name: lms

services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms}
      POSTGRES_DB: lms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  chroma:
    restart: unless-stopped
    image: chromadb/chroma:1.5.9
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "8001:8000"
    volumes:
      - chromadata:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    restart: unless-stopped
    build:
      context: ../backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://lms:${POSTGRES_PASSWORD:-lms}@postgres:5432/lms
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-change-me}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      UPLOAD_DIR: /data/uploads
      INGEST_QUEUE: arq
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_REASONING_EFFORT: ${GROQ_REASONING_EFFORT:-medium}
      GROQ_QUIZ_RETRIES: ${GROQ_QUIZ_RETRIES:-5}
      API_WORKERS: ${API_WORKERS:-1}
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers \"$${API_WORKERS:-1}\" --no-access-log",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    restart: unless-stopped
    build:
      context: ../backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://lms:${POSTGRES_PASSWORD:-lms}@postgres:5432/lms
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-change-me}
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      UPLOAD_DIR: /data/uploads
      INGEST_QUEUE: arq
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_REASONING_EFFORT: ${GROQ_REASONING_EFFORT:-medium}
      GROQ_QUIZ_RETRIES: ${GROQ_QUIZ_RETRIES:-5}
    volumes:
      - uploads:/data/uploads
    read_only: true
    tmpfs:
      - /tmp
      - /home/app/.cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
    command: ["arq", "app.workers.settings.WorkerSettings"]

  web:
    restart: unless-stopped
    build:
      context: ../web
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
      - /home/node/.npm
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  redisdata:
  chromadata:
  uploads:
