[project]
name = "lms-api"
version = "0.1.0"
description = "RAG-powered multi-portal LMS backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy[asyncio]>=2.0.35,<2.1",
    "asyncpg>=0.30,<1.0",
    "aiosqlite>=0.20,<1.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.9,<3.0",
    "pydantic[email]>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "structlog>=24.4,<26.0",
    "python-multipart>=0.0.12,<1.0",
    "httpx>=0.27,<1.0",
    "orjson>=3.10,<4.0",
    "argon2-cffi>=23.1,<26.0",
    "pyjwt>=2.9,<3.0",
    "arq>=0.26,<1.0",
    "redis>=5.1,<6.0",
    "pymupdf>=1.24,<2.0",
    "chromadb>=1.0,<2.0",
    "sentence-transformers>=3.0,<6.0",
    "tenacity>=9.0,<10.0",
    "boto3>=1.35,<2.0",
    "groq>=0.13,<1.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
    "types-redis",
    "reportlab>=4.2,<5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "B011"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests", "migrations"]
ignore_missing_imports = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "arq.*",
    "structlog.*",
    "jwt.*",
    "argon2.*",
    "chromadb.*",
    "sentence_transformers.*",
    "pymupdf.*",
    "fitz.*",
    "boto3.*",
]
ignore_missing_imports = true
